<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2372b"/><stop offset="1" stop-color="#b3221a"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b443"/><stop offset="1" stop-color="#d98a1f"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e99a3a"/><stop offset="1" stop-color="#b8611b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5a0c07" flood-opacity=".45"/></filter>
  </defs>
  <!-- full-bleed background (rounding is applied by the OS / by the "any" variant) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="190" fill="#ffffff" opacity=".07"/>

  <!-- clipboard -->
  <g filter="url(#sh)">
    <rect x="146" y="78" width="220" height="262" rx="28" fill="#fff8ec" stroke="#2e2823" stroke-width="12"/>
    <rect x="206" y="58" width="100" height="46" rx="14" fill="#ffcf3f" stroke="#2e2823" stroke-width="12"/>
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 148 l14 14 l26 -28" fill="none" stroke="#2f7d52" stroke-width="13"/>
      <rect x="238" y="142" width="96" height="16" rx="8" fill="#2e2823"/>
      <path d="M180 204 l14 14 l26 -28" fill="none" stroke="#2f7d52" stroke-width="13"/>
      <rect x="238" y="198" width="80" height="16" rx="8" fill="#2e2823"/>
      <path d="M180 260 l14 14 l26 -28" fill="none" stroke="#2f7d52" stroke-width="13"/>
      <rect x="238" y="254" width="88" height="16" rx="8" fill="#2e2823"/>
    </g>
  </g>

  <!-- pizza slice (bottom-left) -->
  <g filter="url(#sh)" transform="translate(52 318) rotate(-12) scale(.92)">
    <path d="M10 18 Q90 -14 170 18 L96 176 Z" fill="#ffd166" stroke="#2e2823" stroke-width="11" stroke-linejoin="round"/>
    <path d="M6 18 Q90 -22 174 18" fill="none" stroke="url(#crust)" stroke-width="26" stroke-linecap="round"/>
    <path d="M6 18 Q90 -22 174 18" fill="none" stroke="#2e2823" stroke-width="5" stroke-linecap="round" opacity=".0"/>
    <circle cx="70" cy="58" r="15" fill="#d6332a" stroke="#2e2823" stroke-width="5"/>
    <circle cx="118" cy="64" r="13" fill="#d6332a" stroke="#2e2823" stroke-width="5"/>
    <circle cx="96" cy="112" r="12" fill="#d6332a" stroke="#2e2823" stroke-width="5"/>
  </g>

  <!-- drumstick (bottom-right) -->
  <g filter="url(#sh)" transform="translate(318 292) rotate(32) scale(.92)">
    <path d="M58 6 C112 4 148 46 140 96 C134 136 98 152 70 150 L54 186 C66 196 64 214 50 218 C40 222 32 214 30 206 C20 212 6 206 6 194 C6 182 18 176 28 180 L42 144 C14 128 0 98 6 66 C12 30 32 8 58 6 Z" fill="url(#leg)" stroke="#2e2823" stroke-width="11" stroke-linejoin="round"/>
    <path d="M40 46 C52 34 72 30 88 36" fill="none" stroke="#fff3d6" stroke-width="10" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
